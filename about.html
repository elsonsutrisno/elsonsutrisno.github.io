<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About</title>


</head>

<body>
  <p>Hello World</p>
  <div class="main-block">
    <div class="color-block color-block-blue"></div>
    <div class="color-block color-block-green"></div>
    <div class="color-block color-block-red"></div>
    <div class="color-block color-block-yellow"></div>

  </div>
</body>

<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    line-height: 1.6;
    color: #333;
  }

  .color-block {
    width: 150px;
    height: 150px;

    transition: filter 0.2s ease;

  }

  .color-block:hover {
    filter: brightness(0.8);
    cursor: pointer;
    animation: hovering-in-place 0.5s linear infinite alternate;

  }


  .color-block-blue {
    background-color: #3498db;
  }

  .color-block-green {
    background-color: #2ecc71;
  }

  .color-block-red {
    background-color: #e74c3c;

  }

  .color-block-yellow {
    background-color: #e7c83c;
  }

  .main-block {
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    width: 100%;
  }

  /* .main-block {
  animation: hovering-in-place 0.5s linear infinite alternate;
} */

  @keyframes scroll-right {
    from {
      transform: translateX(0);
    }

    to {
      transform: translateX(-600px);
    }
  }

  @keyframes hovering-in-place {
    from {
      transform: translateY(0);
    }

    to {
      transform: translateY(20px);
    }
  }
</style>
